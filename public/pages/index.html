<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Acceso a TalentSync">
  <title>TalentSync · Iniciar sesión</title>
  <link rel="stylesheet" href="../styles/index.css">
</head>
<body data-page="login">
  <main class="login-view">
    <section class="login-card login-card--enhanced" aria-labelledby="login-title">
      <header class="login-header">
        <div class="login-brand-symbol" aria-hidden="true">TS</div>
        <p class="login-brand-name">TalentSync</p>
        <p class="eyebrow">Plataforma de talento</p>
        <h1 id="login-title">Bienvenido</h1>
        <p class="muted login-description">Accede al espacio correspondiente a tu cuenta.</p>
      </header>
      <form id="login-form" class="form-stack login-form" novalidate>
        <div class="login-form-group"><label for="username">Usuario</label><div class="login-input-shell"><input id="username" name="username" autocomplete="username" required placeholder="usuario.demo"></div></div>
        <div class="login-form-group"><label for="password">Contraseña</label><div class="login-input-shell password-field"><input id="password" name="password" type="password" autocomplete="current-password" required><button id="toggle-password" class="login-password-toggle" type="button" aria-label="Mostrar contraseña">Ver</button></div></div>
        <p id="login-error" class="form-error login-message" role="alert" hidden></p>
        <button id="login-button" class="btn btn--primary btn--full login-submit-button" type="submit"><span>Iniciar sesión</span></button>
      </form>
      <details class="demo-accounts"><summary>Credenciales de demostración</summary><dl><div><dt>Reclutador</dt><dd>recruiter.demo / Recruiter2026!</dd></div><div><dt>Candidato</dt><dd>candidate.demo / Candidate2026!</dd></div><div><dt>Empresa</dt><dd>company.demo / Company2026!</dd></div></dl></details>
    </section>
  </main>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script type="module" src="../js/pages/login.js"></script>
</body>
</html>
